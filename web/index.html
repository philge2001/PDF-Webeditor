<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Webeditor</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f4f5; font-family: system-ui, sans-serif; }
    #app { display: block; width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #444; }
    #loading.error { color: #b00020; white-space: pre-wrap; padding: 16px; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="loading">PDF Webeditor wird geladen…</div>

  <script>
    // Texterkennung (OCR) für die App: PDF Tool ruft window.pdftoolOcr auf (PDF-Tool app::ocr_ui::web)
    // und bekommt Tesseracts TSV-Tabelle zurück. tesseract.js, die Erkennung (WebAssembly) und die
    // Sprachdaten liegen in ocr/ (scripts/fetch-tesseract.sh) und werden erst beim ersten Aufruf
    // geladen. tesseract.js rechnet in einem eigenen Web Worker; die Seite bleibt bedienbar.
    let ocrWorker = null;
    let ocrLangs = null;
    let tesseractLoaded = null;

    function loadTesseract() {
      tesseractLoaded ??= new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "ocr/tesseract.min.js";
        script.onload = resolve;
        script.onerror = () => {
          tesseractLoaded = null; // nächster Versuch lädt neu
          reject(new Error("ocr/tesseract.min.js konnte nicht geladen werden"));
        };
        document.head.append(script);
      });
      return tesseractLoaded;
    }

    window.pdftoolOcr = async (rgba, width, height, langs) => {
      // Pixel sofort kopieren: rgba zeigt in den WebAssembly-Speicher der App, der sich ändern kann.
      const image = new ImageData(new Uint8ClampedArray(rgba), width, height);
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").putImageData(image, 0, 0);

      await loadTesseract();
      if (!ocrWorker || ocrLangs !== langs) {
        const old = ocrWorker;
        ocrWorker = null;
        await old?.terminate();
        const base = new URL("ocr/", location.href).href;
        const worker = await Tesseract.createWorker(langs.split("+"), Tesseract.OEM.LSTM_ONLY, {
          workerPath: base + "worker.min.js",
          corePath: base + "core",
          langPath: base + "lang",
        });
        // Wie in der Desktop-App: automatische Seitenaufteilung (Spalten, Blöcke), 300 dpi.
        await worker.setParameters({
          tessedit_pageseg_mode: Tesseract.PSM.AUTO,
          user_defined_dpi: "300",
        });
        ocrWorker = worker;
        ocrLangs = langs;
      }
      const { data } = await ocrWorker.recognize(canvas, {}, { tsv: true });
      return data.tsv;
    };
  </script>
  <!-- Definiert PDFiumModule() (Emscripten, modularisiert); lädt pdfium.wasm aus demselben Ordner. -->
  <script src="pdfium/pdfium.js"></script>
  <script type="module">
    // Den Platzhalter hinter ?v= ersetzt das Build-Skript durch „PDF-Tool-rev-Uhrzeit“. So lädt der
    // Browser nach jedem Build die neue App statt einer zwischengespeicherten alten.
    import init, { initialize_pdfium_render, start } from "./pkg/pdf_webeditor.js?v=__BUILD__";
    console.info("PDF Webeditor, Build __BUILD__");

    const loading = document.getElementById("loading");
    try {
      // Beide WebAssembly-Module parallel laden: PDFium (C++) und unsere App (Rust).
      const [pdfium, rust] = await Promise.all([PDFiumModule(),
        init({ module_or_path: "./pkg/pdf_webeditor_bg.wasm?v=__BUILD__" }),
      ]);
      // Brücke herstellen: pdfium-render ruft PDFium-Funktionen über dieses Modul-Objekt auf.
      if (!initialize_pdfium_render(pdfium, rust, false)) {
        throw new Error("initialize_pdfium_render ist fehlgeschlagen (Details in der Konsole)");
      }
      loading.remove();
      await start("app");
    } catch (e) {
      console.error(e);
      loading.classList.add("error");
      loading.textContent = "Start fehlgeschlagen:\n" + e;
    }
  </script>
</body>
</html>
