[package]
name = "pdf-webeditor"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "PDF Tool als Webapp (läuft vollständig im Browser)"

[lib]
# cdylib = WebAssembly-Modul für den Browser; rlib für spätere Tests (wasm-bindgen-test).
crate-type = ["cdylib", "rlib"]

[dependencies]
# Die komplette Oberfläche aus dem Desktop-Projekt (eine Codebasis für beide Versionen),
# ohne Texterkennung (Tesseract lässt sich nicht für den Browser bauen, siehe W6).
# Fester Commit, damit Builds reproduzierbar bleiben; bei Bedarf bewusst hochziehen.
pdftool-app = { git = "https://github.com/philge2001/PDF-Tool", rev = "b8891838ee884a26a8c343127f7d221a3ad86e3a", default-features = false }
# egui im Browser (WebGL über glow), dieselbe Version wie die Desktop-App.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Muss exakt zur installierten wasm-bindgen-cli passen (scripts/build.sh prüft das).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
# Panics als lesbare Meldung in der Browser-Konsole.
console_error_panic_hook = "0.1"
# Log-Meldungen der App (tracing) in die Browser-Konsole – MIT/Apache.
tracing-wasm = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Kleineres WebAssembly: weniger Ladezeit im Browser.
opt-level = "s"
lto = true
codegen-units = 1

