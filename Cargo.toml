[package]
name = "pdf-webeditor"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "PDF Tool als Webapp (läuft vollständig im Browser)"

[lib]
# cdylib = WebAssembly-Modul für den Browser; rlib für spätere Tests (wasm-bindgen-test).
crate-type = ["cdylib", "rlib"]

[dependencies]
# Fachlogik direkt aus dem Desktop-Projekt – eine Codebasis für beide Versionen.
# Fester Commit, damit Builds reproduzierbar bleiben; bei Bedarf bewusst hochziehen.
pdftool-core = { git = "https://github.com/philge2001/PDF-Tool", rev = "18bec9591914de45a4e60660e114ca92ab828d03" }
# Gleiche Version wie im Desktop-Projekt; im Browser bindet sie sich an pdfium.wasm (siehe web/index.html).
# Ohne `thread_safe`: im Browser gibt es (vorerst) nur einen Thread.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest"] }
# egui im Browser (WebGL über glow), dieselbe Version wie die Desktop-App.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
# Datei-Dialog: im Browser ein <input type="file">, liefert die Bytes asynchron.
rfd = "0.17"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Muss exakt zur installierten wasm-bindgen-cli passen (scripts/build.sh prüft das).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Performance"] }
# Zufallszahlen kommen im Browser von crypto.getRandomValues (pdftool-core braucht sie für AES-256).
getrandom = { version = "0.4", features = ["wasm_js"] }
# Panics als lesbare Meldung in der Browser-Konsole; Logausgabe dorthin.
console_error_panic_hook = "0.1"
console_log = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Kleineres WebAssembly: weniger Ladezeit im Browser.
opt-level = "s"
lto = true
codegen-units = 1
